<!doctype html>
<html lang="en" data-template="headline">
<head>
<meta charset="utf-8">
<title>headline</title>
<!-- Headline ad: one big statement with an accent word, and a supporting line. Slots: headline accentWord support. Colors, fonts, --pad, --rule and --icon are CSS variables injected by src/render.ts from brand/brand.json. -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { font-family: var(--font-body); font-weight: var(--font-body-weight); -webkit-font-smoothing: antialiased; }
  .ad { width: 100vw; height: 100vh; padding: var(--pad); display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; height: var(--icon); }
  [data-icon] { width: var(--icon); height: var(--icon); color: var(--color-terracotta); flex: none; }
  [data-icon] svg { width: 100%; height: 100%; display: block; }
  .body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .stack { margin-top: auto; margin-bottom: auto; padding-top: 24px; }
  .display { font-family: var(--font-display); font-weight: var(--font-display-weight); letter-spacing: var(--font-display-tracking); }
  .eyebrow { font-family: var(--font-eyebrow); font-weight: var(--font-eyebrow-weight); letter-spacing: var(--font-eyebrow-tracking); text-transform: var(--font-eyebrow-transform); font-size: 20px; color: var(--color-ash); }
  .foot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 32px; }
  .accent { color: var(--color-terracotta); }
  body { background: var(--color-ink); color: var(--color-marble); }
  .headline { font-size: 150px; line-height: 0.98; color: var(--color-marble); max-width: 9ch; }
  :root[data-format="portrait"] .headline { font-size: 168px; }
  .rule { width: 112px; height: var(--rule); background: var(--color-ash); margin: 48px 0 36px; }
  .support { font-size: 44px; line-height: 1.25; color: var(--color-lavender); max-width: 24ch; }
  :root[data-format="portrait"] .support { font-size: 48px; }
</style>
</head>
<body>
  <main class="ad">
    <header class="top"><span data-icon></span></header>
    <section class="body" data-fit-box>
      <div class="stack">
        <h1 class="display headline" data-slot="headline" data-accent-slot="accentWord" data-fit></h1>
        <div class="rule"></div>
        <p class="support" data-slot="support" data-fit></p>
      </div>
    </section>
    <footer class="foot"><span class="eyebrow" data-brand="name"></span><span class="eyebrow" data-brand="siteHost"></span></footer>
  </main>
</body>
</html>
