<!doctype html>
<html lang="en" data-template="holiday">
<head>
<meta charset="utf-8">
<title>holiday</title>
<!-- Holiday ad: a big greeting in the season's first accent, one warm line, and a sign-off from the studio. Rendered with the seasonal theme's accent colors. Slots: greeting line. Colors, fonts, --pad, --rule and --icon are CSS variables injected by src/render.ts from brand/brand.json. -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { font-family: var(--font-body); font-weight: var(--font-body-weight); -webkit-font-smoothing: antialiased; }
  .ad { width: 100vw; height: 100vh; padding: var(--pad); display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; height: var(--icon); }
  [data-icon] { width: var(--icon); height: var(--icon); color: var(--color-terracotta); flex: none; }
  [data-icon] svg { width: 100%; height: 100%; display: block; }
  .body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .stack { margin-top: auto; margin-bottom: auto; padding-top: 24px; }
  .display { font-family: var(--font-display); font-weight: var(--font-display-weight); letter-spacing: var(--font-display-tracking); }
  .eyebrow { font-family: var(--font-eyebrow); font-weight: var(--font-eyebrow-weight); letter-spacing: var(--font-eyebrow-tracking); text-transform: var(--font-eyebrow-transform); font-size: 20px; color: var(--color-ash); }
  .foot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 32px; }
  .accent { color: var(--color-terracotta); }
  body { background: var(--color-ink); color: var(--color-marble); }
  .ad { align-items: center; text-align: center; }
  .body { align-items: center; width: 100%; }
  .stack { display: flex; flex-direction: column; align-items: center; }
  .dots { display: flex; gap: 18px; margin-bottom: 44px; }
  .dots i { width: 22px; height: 22px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: var(--accent-1); } .dots i:nth-child(2) { background: var(--accent-2); }
  .dots i:nth-child(3) { background: var(--accent-3); } .dots i:nth-child(4) { background: var(--accent-4); }
  .greeting { font-size: 150px; line-height: 0.98; color: var(--accent-1); max-width: 9ch; }
  :root[data-format="portrait"] .greeting { font-size: 168px; }
  .line { margin-top: 40px; font-size: 44px; line-height: 1.3; color: var(--color-marble); max-width: 24ch; }
  :root[data-format="portrait"] .line { font-size: 48px; }
  .signoff { margin-top: 44px; font-size: 22px; color: var(--accent-2); }
  .foot { gap: 16px; justify-content: center; }
</style>
</head>
<body>
  <main class="ad">
    <header class="top"><span data-icon></span></header>
    <section class="body" data-fit-box>
      <div class="stack">
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <h1 class="display greeting" data-slot="greeting" data-fit data-fit-width="greeting"></h1>
        <p class="line" data-slot="line" data-fit></p>
        <p class="eyebrow signoff" data-brand="signoff"></p>
      </div>
    </section>
    <footer class="foot"><span class="eyebrow" data-brand="siteHost"></span></footer>
  </main>
</body>
</html>
