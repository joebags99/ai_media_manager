<!doctype html>
<html lang="en" data-template="screenshot">
<head>
<meta charset="utf-8">
<title>screenshot</title>
<!--
  Screenshot ad: white headline with one orange accent word, plus a crop of a client site.
  Slots: headline accentWord crop
  crop.treatment "framed" shows the crop in a browser frame; "dimmed" puts it full-bleed behind an ink wash.
  Colors, fonts, --pad, --rule and --icon are CSS variables injected by src/render.ts from brand/brand.json.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    background: var(--color-ink);
    color: var(--color-marble);
    font-family: var(--font-body);
    font-weight: var(--font-body-weight);
    -webkit-font-smoothing: antialiased;
  }
  .ad { position: relative; width: 100vw; height: 100vh; padding: var(--pad); display: flex; flex-direction: column; }

  .top { display: flex; align-items: center; height: var(--icon); }
  [data-icon] { width: var(--icon); height: var(--icon); color: var(--color-terracotta); flex: none; }
  [data-icon] svg { width: 100%; height: 100%; display: block; }

  .head { flex: none; max-height: 42%; overflow: hidden; margin-top: 40px; }
  .headline {
    font-family: var(--font-display);
    font-weight: var(--font-display-weight);
    letter-spacing: var(--font-display-tracking);
    color: var(--color-marble);
    font-size: 104px;
    line-height: 1.0;
    max-width: 11ch;
  }
  :root[data-format="portrait"] .headline { font-size: 116px; }
  .accent { color: var(--color-terracotta); }

  /* framed treatment */
  .shot-area { flex: 1; min-height: 0; margin-top: 56px; display: flex; align-items: center; justify-content: flex-start; }
  .shot-frame {
    background: var(--color-inkSoft);
    border: 2px solid var(--color-ash);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  }
  .shot-bar { height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 2px solid var(--color-ash); }
  .shot-bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--color-ash); }
  .shot-view { position: relative; overflow: hidden; }
  .shot-bar i:first-child { background: var(--color-terracotta); }

  /* dimmed treatment */
  .shot-bg { position: fixed; inset: 0; overflow: hidden; display: none; }
  .shot-bg img { filter: grayscale(1) blur(3px); }
  .shot-bg::after { content: ""; position: absolute; inset: 0; background: var(--color-ink); opacity: 0.86; }
  :root[data-treatment="dimmed"] .shot-bg { display: block; }
  :root[data-treatment="dimmed"] .shot-area { display: none; }
  :root[data-treatment="dimmed"] .head { margin-top: auto; max-height: none; }

  .foot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 32px; }
  .eyebrow {
    font-family: var(--font-eyebrow);
    font-weight: var(--font-eyebrow-weight);
    letter-spacing: var(--font-eyebrow-tracking);
    text-transform: var(--font-eyebrow-transform);
    font-size: 20px;
    color: var(--color-ash);
  }
  :root[data-treatment="dimmed"] .foot .eyebrow { color: var(--color-lavender); }
</style>
</head>
<body>
  <div class="shot-bg" data-crop="cover"><img alt=""></div>
  <main class="ad">
    <header class="top"><span data-icon></span></header>
    <section class="head" data-fit-box>
      <h1 class="headline" data-slot="headline" data-accent-slot="accentWord" data-fit></h1>
    </section>
    <section class="shot-area" data-crop-area>
      <div class="shot-frame" data-crop-frame>
        <div class="shot-bar"><i></i><i></i><i></i></div>
        <div class="shot-view" data-crop="contain"><img alt=""></div>
      </div>
    </section>
    <footer class="foot">
      <span class="eyebrow" data-brand="name"></span>
      <span class="eyebrow" data-brand="siteHost"></span>
    </footer>
  </main>
</body>
</html>
